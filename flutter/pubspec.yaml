name: global_ds
description: ICICI Bank GlobalDS foundations, Material theme, and Flutter components.
version: 0.6.0-dev.1
publish_to: none
repository: https://github.com/paneerpakoda/global-design-system

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter_svg: ^2.3.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Mulish
      fonts:
        - asset: lib/fonts/Mulish-Regular.ttf
          weight: 400
        - asset: lib/fonts/Mulish-SemiBold.ttf
          weight: 600
        - asset: lib/fonts/Mulish-Bold.ttf
          weight: 700
